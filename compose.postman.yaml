# Standalone test stack: never combine this file with compose.yaml.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: banking_postman_test
      POSTGRES_USER: postman_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
      DATABASE_USERNAME: postman_test
      DATABASE_PASSWORD_FILE: /run/secrets/app_password
      FLYWAY_USERNAME: postman_migrator
      FLYWAY_PASSWORD_FILE: /run/secrets/migrator_password
    secrets: [admin_password, app_password, migrator_password]
    volumes:
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postman_admin -d banking_postman_test']
      interval: 2s
      timeout: 3s
      retries: 30
    labels:
      banking.test-suite: postman
  migrate:
    secrets: [migrator_password]
    image: ${POSTMAN_TEST_API_IMAGE:-${COMPOSE_PROJECT_NAME}-api}
    pull_policy: never
    entrypoint: [java, '-Dloader.main=com.italo.bankingapi.migration.MigrationRunner', -cp, /app/app.jar, org.springframework.boot.loader.launch.PropertiesLauncher]
    environment:
      MIGRATION_DATABASE_URL: jdbc:postgresql://db:5432/banking_postman_test?connectTimeout=2&socketTimeout=30
      FLYWAY_USERNAME: postman_migrator
      FLYWAY_PASSWORD_FILE: /run/secrets/migrator_password
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: 'no'
    labels:
      banking.test-suite: postman
  api:
    secrets:
      - source: app_password
        target: spring.datasource.password
      - source: jwt_secret
        target: jwt.secret
    image: ${POSTMAN_TEST_API_IMAGE:-${COMPOSE_PROJECT_NAME}-api}
    pull_policy: never
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/banking_postman_test?connectTimeout=2&socketTimeout=3
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: '3000'
      DATABASE_USERNAME: postman_test
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      BANKING_SECRETS_DIRECTORY: /run/secrets/
      SPRING_FLYWAY_ENABLED: 'false'
      JWT_EXPIRATION: '86400000'
      SERVER_PORT: '8080'
      SHOW_SQL: 'false'
    ports:
      - '127.0.0.1::8080'
    depends_on:
      migrate:
        condition: service_completed_successfully
    labels:
      banking.test-suite: postman

secrets:
  admin_password:
    file: ${POSTMAN_TEST_SECRETS_DIR:?Set secrets directory}/admin_password
  app_password:
    file: ${POSTMAN_TEST_SECRETS_DIR:?Set secrets directory}/app_password
  migrator_password:
    file: ${POSTMAN_TEST_SECRETS_DIR:?Set secrets directory}/migrator_password
  jwt_secret:
    file: ${POSTMAN_TEST_SECRETS_DIR:?Set secrets directory}/jwt_secret
