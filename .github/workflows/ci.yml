name: Banking API CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: banking_api_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d banking_api_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw clean verify
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/banking_api_test
          TEST_DATABASE_USERNAME: postgres
          TEST_DATABASE_PASSWORD: postgres

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: banking-ci
      DB_NAME: banking_ci
      DB_USERNAME: banking_ci
      API_PORT: '18080'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Test Postman infrastructure
        id: node
        run: node --test scripts/postman/*.test.mjs

      - name: Install verified Postman CLI
        id: install
        run: bash scripts/ci/install-postman.sh

      - name: Generate temporary environment secrets
        id: environment
        shell: bash
        run: |
          db_password=$(openssl rand -hex 32)
          admin_password=$(openssl rand -hex 32)
          migrator_password=$(openssl rand -hex 32)
          jwt_secret=$(openssl rand -hex 32)
          echo "::add-mask::$db_password"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$migrator_password"
          echo "::add-mask::$jwt_secret"
          printf 'DB_PASSWORD=%s\nJWT_SECRET=%s\n' "$db_password" "$jwt_secret" >> "$GITHUB_ENV"
          printf 'DB_ADMIN_PASSWORD=%s\nFLYWAY_PASSWORD=%s\n' "$admin_password" "$migrator_password" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        id: config
        run: docker compose config --quiet

      - name: Build API image
        id: image
        timeout-minutes: 15
        shell: bash
        run: |
          docker compose --progress plain build > "$RUNNER_TEMP/image-build.log" 2>&1
          image_id=$(docker image inspect "$COMPOSE_PROJECT_NAME-api" --format '{{.Id}}')
          printf 'API_IMAGE_ID=%s\n' "$image_id" >> "$GITHUB_ENV"

      - name: Start healthy services
        id: startup
        timeout-minutes: 5
        shell: bash
        run: docker compose up -d --no-build --wait --wait-timeout 180 > "$RUNNER_TEMP/startup.log" 2>&1

      - name: Test real HTTP financial flow
        id: smoke
        timeout-minutes: 2
        shell: pwsh
        run: |
          try {
            ./scripts/Test-Compose.ps1 -BaseUrl http://localhost:18080 *> $null
            Write-Output 'Compose HTTP smoke passed.'
          } catch {
            Write-Error 'Compose HTTP smoke failed; native output withheld.'
            exit 1
          }

      - name: Remove test containers and volumes
        id: cleanup
        if: always() && steps.environment.outcome == 'success'
        timeout-minutes: 3
        shell: bash
        run: |
          docker compose down --volumes --remove-orphans > "$RUNNER_TEMP/cleanup.log" 2>&1
          containers=$(docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")
          networks=$(docker network ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")
          volumes=$(docker volume ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")
          test -z "$containers$networks$volumes"

      - name: Run isolated Postman collection
        id: postman
        timeout-minutes: 12
        run: node scripts/postman/run.mjs --image "$API_IMAGE_ID"

      - name: Generate sanitized pipeline reports
        if: always()
        env:
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
        run: node scripts/ci/report.mjs

      - name: Upload sanitized reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/ci/junit.xml
            target/ci/summary.md
            target/postman/latest/junit.xml
            target/postman/latest/summary.md
          retention-days: 7
          if-no-files-found: error
