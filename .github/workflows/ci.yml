name: Banking API CI

on:
  pull_request:
    branches:
      - develop

  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: banking_api_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d banking_api_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw clean verify
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/banking_api_test
          TEST_DATABASE_USERNAME: postgres
          TEST_DATABASE_PASSWORD: postgres

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: banking-ci
      DB_NAME: banking_ci
      DB_USERNAME: banking_ci
      API_PORT: '18080'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate temporary environment secrets
        shell: bash
        run: |
          mkdir -p artifacts
          db_password=$(openssl rand -hex 32)
          jwt_secret=$(openssl rand -hex 32)
          echo "::add-mask::$db_password"
          echo "::add-mask::$jwt_secret"
          printf 'DB_PASSWORD=%s\nJWT_SECRET=%s\n' "$db_password" "$jwt_secret" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build API image
        timeout-minutes: 15
        shell: bash
        run: docker compose --progress plain build 2>&1 | tee artifacts/image-build.log

      - name: Start healthy services
        timeout-minutes: 5
        shell: bash
        run: docker compose up -d --wait --wait-timeout 180 2>&1 | tee artifacts/startup.log

      - name: Test real HTTP financial flow
        timeout-minutes: 2
        shell: pwsh
        run: |
          try {
            ./scripts/Test-Compose.ps1 -BaseUrl http://localhost:18080 | Tee-Object -FilePath artifacts/http-smoke.log
          } catch {
            $_ | Out-String | Add-Content artifacts/http-smoke.log
            throw
          }

      - name: Collect service diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          docker compose ps --all > artifacts/compose-status.log 2>&1 || true
          docker compose logs --no-color --timestamps > artifacts/compose-services.log 2>&1 || true

      - name: Remove test containers and volumes
        if: always()
        timeout-minutes: 2
        shell: bash
        run: docker compose down --volumes --remove-orphans 2>&1 | tee artifacts/cleanup.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*.log
          retention-days: 7
          if-no-files-found: warn
