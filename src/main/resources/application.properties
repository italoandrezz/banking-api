spring.application.name=banking-api-service

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/banking_db}
spring.datasource.username=${DATABASE_USERNAME:banking_app}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/callback
spring.flyway.user=${FLYWAY_USERNAME}
spring.flyway.password=${FLYWAY_PASSWORD}
spring.flyway.clean-disabled=true

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

server.port=${SERVER_PORT:8080}
# The entry proxy uses TCP peer addresses and removes untrusted forwarding headers.
server.forward-headers-strategy=none

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
# Metrics stay in-process; never expose diagnostics to banking customers.
spring.jmx.enabled=false
management.endpoints.jmx.exposure.exclude=*
spring.main.banner-mode=off
logging.structured.format.console=com.italo.bankingapi.config.logging.SafeJsonLogFormatter
logging.structured.format.file=com.italo.bankingapi.config.logging.SafeJsonLogFormatter
