spring.datasource.url=${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/banking_api_test}
spring.datasource.username=${TEST_DATABASE_USERNAME:postgres}
spring.datasource.password=${TEST_DATABASE_PASSWORD:admin}
spring.datasource.hikari.connection-init-sql=SET search_path TO banking_api_tests

spring.flyway.enabled=true
spring.flyway.schemas=banking_api_tests
# Legacy regression fixtures manage their own disposable schemas and TRUNCATE data.
# Production roles and callbacks are exercised by PostgresPrivilegesTest and Postman.
spring.flyway.user=${TEST_DATABASE_USERNAME:postgres}
spring.flyway.password=${TEST_DATABASE_PASSWORD:admin}
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=banking_api_tests
spring.jpa.properties.hibernate.default_schema=banking_api_tests
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Test-only signing key; never use outside the test profile.
jwt.secret=01234567890123456789012345678901
jwt.expiration=86400000
